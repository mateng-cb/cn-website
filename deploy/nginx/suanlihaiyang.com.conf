map $http_x_forwarded_proto $website_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      "http";
}

server {
    listen 80;
    server_name www.suanlihaiyang.com;
    return 301 https://suanlihaiyang.com$request_uri;
}

server {
    listen 80;
    server_name suanlihaiyang.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $website_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
